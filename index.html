<head>

<style>

  .option.correct { border-color:#16a34a; background:#dcfce7; }
  .option.wrong { border-color:#dc2626; background:#fee2e2; }

  .feedback.bad { background:#fee2e2; color:#991b1b; }

  .stat { flex:1; min-width:110px; background:#f1f5f9; border-radius:10px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:1.5em; color:#1a3a5c; }
  .stat span { font-size:.85em; color:#64748b; }
  .progress { height:9px; background:#e2e8f0; border-radius:5px; overflow:hidden; margin-bottom:18px; }

  .review-item { border-left:4px solid #dc2626; padding:8px 14px; margin:10px 0; background:#fef2f2; border-radius:6px; font-size:.95em; }

  .review-item .your { color:#991b1b; }
  .badge { display:inline-block; background:#e0e7ff; color:#3730a3; padding:2px 10px; border-radius:20px; font-size:.8em; font-weight:600; }
</style>
</head>
<body>
<div class="container">

  <div id="menu" class="card">
    <p style="text-align:center;font-size:1.05em;">Выберите режим тренировки:</p>

    <div id="options"></div>

    <div id="review"></div>
    <div style="text-align:center;margin-top:16px;">
      <button class="btn btn-primary" onclick="goMenu()">↩ В меню</button>
    </div>
  </div>
</div>

  { q: "При попадании крови на халат, одежду верная последовательность:", options: ["снять одежду и погрузить в дезраствор или в герметичном мешке направить для стирки с дезинфекцией в прачечную","снять одежду, поместить в бикс и проавтоклавировать","в конце смены продезинфицировать химическим способом","снять одежду и направить в прачечную для стирки"], correct: [0] },
  { q: "Для эффективного мытья и обеззараживания рук необходимо соблюдать:", options: ["коротко подстриженные ногти","температуру воды 45-50 °С","отсутствие на руках колец","отсутствие искусственных ногтей","отсутствие лака на ногтях","наличие щеток для мытья рук","наличие жидкого мыла","наличие дозаторов с моющим средством и кожным антисептиком"], correct: [0,2,3,4] }
];

/* ============================================================
   ЛОГИКА ПРОГРАММЫ
   ============================================================ */
let state = { pool: [], idx: 0, correct: 0, wrong: 0, mode: '', wrongList: [], answered: false };

const $ = id => document.getElementById(id);
$('totalQ').textContent = QUESTIONS.length;

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function goMenu(){
  $('menu').classList.remove('hidden');
  $('quiz').classList.add('hidden');
  $('result').classList.add('hidden');
}

function startTrain(){
  state = { pool: shuffle(QUESTIONS), idx: 0, correct: 0, wrong: 0, mode: 'train', wrongList: [], answered: false };
  goQuiz();
}

function startExam(){
  const n = Math.min(20, QUESTIONS.length);
  state = { pool: shuffle(QUESTIONS).slice(0,n), idx: 0, correct: 0, wrong: 0, mode: 'exam', wrongList: [], answered: false };
  goQuiz();
}

function goQuiz(){
  $('menu').classList.add('hidden');
  $('result').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion(){
  state.answered = false;
  const q = state.pool[state.idx];
  $('feedback').innerHTML = '';
  $('nextBtn').classList.add('hidden');
  $('nextBtn').textContent = (state.idx === state.pool.length - 1) ? 'Завершить →' : 'Следующий вопрос →';
  $('counter').textContent = `Вопрос ${state.idx + 1} из ${state.pool.length}`;
  $('modeBadge').textContent = state.mode === 'train' ? 'Тренировка' : 'Экзамен';
  $('qText').textContent = q.q;
  $('bar').style.width = ((state.idx) / state.pool.length * 100) + '%';

  const opts = $('options');
  opts.innerHTML = '';
  const order = shuffle(q.options.map((_, i) => i));
  const multi = q.correct.length > 1;
  const selected = new Set();

  order.forEach(origIdx => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = q.options[origIdx];
    b.dataset.orig = origIdx;
    b.onclick = () => {
      if (state.answered) return;
      if (state.mode === 'train') {
        checkAnswer([origIdx], q, opts);
      } else {
        if (multi) {
          if (selected.has(origIdx)) { selected.delete(origIdx); b.classList.remove('selected'); }
          else { selected.add(origIdx); b.classList.add('selected'); }
          let okBtn = $('submitBtn');
          if (!okBtn) {
            okBtn = document.createElement('button');
            okBtn.id = 'submitBtn';
            okBtn.className = 'btn btn-green';
            okBtn.textContent = '✓ Ответить';
            okBtn.onclick = () => checkAnswer([...selected], q, opts);
            $('feedback').appendChild(okBtn);
          }
        } else {
          checkAnswer([origIdx], q, opts);
        }
      }
    };
    opts.appendChild(b);
  });
}

function checkAnswer(chosen, q, opts){
  if (state.answered) return;
  state.answered = true;
  const isCorrect = chosen.length === q.correct.length && chosen.every(c => q.correct.includes(c));
  if (isCorrect) state.correct++; else { state.wrong++; state.wrongList.push({ q: q.q, correct: q.correct.map(i=>q.options[i]), your: chosen.map(i=>q.options[i]) }); }

  [...opts.children].forEach(b => {
    const oi = +b.dataset.orig;
    b.disabled = true;
    if (q.correct.includes(oi)) b.classList.add('correct');
    else if (chosen.includes(oi)) b.classList.add('wrong');
  });

  const fb = $('feedback');
  fb.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'feedback ' + (isCorrect ? 'ok' : 'bad');
  if (isCorrect) div.textContent = '✅ Правильно!';
  else div.innerHTML = '❌ Неправильно. Правильный ответ: <b>' + q.correct.map(i=>q.options[i]).join(', ') + '</b>';
  fb.appendChild(div);

  $('nextBtn').classList.remove('hidden');
  $('bar').style.width = ((state.idx + 1) / state.pool.length * 100) + '%';
}

function nextQuestion(){
  state.idx++;
  if (state.idx >= state.pool.length) {
    if (state.mode === 'exam') showResult();
    else { alert(`Тренировка завершена!\nПравильно: ${state.correct}\nНеправильно: ${state.wrong}`); goMenu(); }
    return;
  }
  renderQuestion();
}

function showResult(){
  $('quiz').classList.add('hidden');
  $('result').classList.remove('hidden');
  const total = state.correct + state.wrong;
  const pct = Math.round(state.correct / total * 100);
  $('resultScore').textContent = pct + '%';
  $('resultScore').style.color = pct >= 70 ? '#16a34a' : pct >= 50 ? '#d97706' : '#dc2626';
  $('rCorrect').textContent = state.correct;
  $('rWrong').textContent = state.wrong;
  $('rTotal').textContent = total;
  const rev = $('review');
  rev.innerHTML = state.wrongList.length ? '<h3>Разбор ошибок:</h3>' : '<p style="color:#16a34a;text-align:center;font-weight:600;">🎉 Ошибок нет!</p>';
  state.wrongList.forEach(w => {
    const d = document.createElement('div');
    d.className = 'review-item';
    d.innerHTML = `<div><b>${w.q}</b></div><div class="ans">Правильно: ${w.correct.join(', ')}</div><div class="your">Ваш ответ: ${w.your.join(', ') || '—'}</div>`;
    rev.appendChild(d);
  });
}

function resetProgress(){ if(confirm('Сбросить статистику?')){ localStorage.clear(); alert('Статистика сброшена.'); } }
</script>
